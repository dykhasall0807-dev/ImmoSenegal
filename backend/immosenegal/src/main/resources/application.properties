spring.application.name=immosenegal

# Connexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/immosenegal
spring.datasource.username=immouser
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Gestion des tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Securite JWT (le secret vient de la variable JWT_SECRET)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-heures=24
